# Runs the engine in the cloud for free. State (journal, model versions) and the
# app's JSON snapshots are committed back to this repo — no database anywhere.
name: daily-engine

on:
  schedule:
    # Backup only. GitHub can run these hours late; the Oracle server (server/install-cron.sh)
    # starts the same jobs on the minute through workflow_dispatch. A duplicate run is harmless.
    - cron: "37 18 * * 0-4"   # 00:07 IST  overnight PREVIEW (Europe closed, US mid-session)
    - cron: "43 1 * * 1-5"    # 07:13 IST  FINAL pre-market plan (US close, futures, Asia open)
    - cron: "47 10 * * 1-5"   # 16:17 IST  scan, grade results, retrain, publish
    - cron: "7-57/10 3-9 * * 1-5" # :07,:17.. 08:37-15:27 IST: live snapshot (skips outside 09:00-15:45)
  workflow_dispatch:
    inputs:
      task:
        description: "bootstrap | premarket | postclose | learn | publish | live | paperclose"
        default: "publish"

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "47 10 * * 1-5" ]; then
            TASK=postclose
          elif [ "${{ github.event.schedule }}" = "7-57/10 3-9 * * 1-5" ]; then
            TASK=live
          else
            TASK=premarket
          fi
          echo "TASK=$TASK" >> "$GITHUB_ENV"
          cd backend && python engine.py "$TASK"
      - name: Commit state and snapshots
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add state docs
          git commit -m "engine: $TASK $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" || exit 0
          git pull --rebase
          git push
      - name: Record the failure (error text only)
        if: failure()
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git checkout -- docs || true
          git add state/run_errors.json || exit 0
          git commit -m "engine: FAILED $TASK $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" || exit 0
          git stash --include-untracked || true   # half-written files from the failed run are not kept
          git pull --rebase
          git push
