# Runs the engine in the cloud for free. State (journal, model versions) and the
# app's JSON snapshots are committed back to this repo — no database anywhere.
name: daily-engine

on:
  schedule:
    - cron: "30 2 * * 1-5"    # 08:00 IST  pre-market bias + options
    - cron: "0 11 * * 1-5"    # 16:30 IST  scan, grade results, retrain, publish
  workflow_dispatch:
    inputs:
      task:
        description: "bootstrap | premarket | postclose | learn | publish"
        default: "publish"

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "30 2 * * 1-5" ]; then
            TASK=premarket
          else
            TASK=postclose
          fi
          echo "TASK=$TASK" >> "$GITHUB_ENV"
          cd backend && python engine.py "$TASK"
      - name: Commit state and snapshots
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add state docs
          git commit -m "engine: $TASK $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" || exit 0
          git pull --rebase
          git push
